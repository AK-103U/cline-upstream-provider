<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cline 渠道卡片 · 样式台</title>
<!--
  只做样式微调：页面里只有卡片 + 它挂靠的 pill，没有聊天记录、没有假窗口、没有状态演示。
  右侧小按钮切深/浅色。
  卡片 CSS 与 dsh/client.js 的 STYLE 逐条对应，改这里等于改生产样式；
  所有颜色集中在下面 :root 区的令牌里，调色只用动那几行。
  品牌色、别名、品牌图标全部从插件源码生成，页面里不重复实现，改插件不会产生歧义：
    node tools/sync-preview.mjs docs/hover-card-preview.html
-->
<style>
/* ===================== 调色板（只改这里） ===================== */
html[data-theme="dark"]{
  --page:#1d1d20;
  --card-bg:#26262b;
  --card-line:rgba(127,127,127,.22);
  --label-1:#ececf1;      /* 渠道名 */
  --label-2:#a2a2ad;      /* 次级文字 */
  --caption:#74747f;      /* 管道名 / ＋N */
  --wash:rgba(127,127,127,.14);   /* pill 悬浮底 */
  --pill-text:#a2a2ad;
  --pill-arrow:#74747f;
}
html[data-theme="light"]{
  --page:#ffffff;
  --card-bg:#ffffff;
  --card-line:rgba(0,0,0,.14);
  --label-1:#1c1c20;
  --label-2:#5f5f6a;
  --caption:#8f8f9a;
  --wash:rgba(0,0,0,.06);
  --pill-text:#5f5f6a;
  --pill-arrow:#8f8f9a;
}
/* 品牌色，深浅各一套（与 dsh/client.js 的 COLORS 相同） */
.dark-only{display:inline}
html[data-theme="light"] .dark-only{display:none}
html[data-theme="light"] .light-only{display:inline}
.light-only{display:none}

/* ===================== 页面 ===================== */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:0 26px 26px;display:flex;align-items:flex-end;justify-content:flex-start;
  background:var(--page);color:var(--label-1);
  font:13px/1.5 "Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.theme-toggle{
  position:fixed;top:14px;right:16px;border:1px solid var(--card-line);background:transparent;
  color:var(--label-2);font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;cursor:pointer;
}
.dock{position:relative;display:flex;align-items:center;min-height:26px;padding-bottom:2px}

/* ===================== pill（触发区，与生产一致） ===================== */
.cline-trigger{
  display:inline-flex;align-items:center;gap:4px;margin:0;border:0;padding:0;background:transparent;
  font:inherit;cursor:default;border-radius:8px;
}
.cline-pill{
  display:flex;align-items:center;gap:6px;padding:1px 8px;border-radius:8px;
  color:var(--pill-text);font-size:13px;line-height:20px;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.cline-trigger:hover .cline-pill,.cline-trigger[data-open="true"] .cline-pill{background:var(--wash)}
.cline-link{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:inherit}
.cline-arrow{color:var(--pill-arrow);padding:0 2px}
.cline-mark,.cline-mark>svg,.cline-mark>img{display:block;width:14px;height:14px;flex:none}

/* ===================== 卡片（与 dsh/client.js 的 STYLE 对应） ===================== */
.cline-card{
  position:absolute;left:0;bottom:calc(100% + 8px);z-index:40;width:420px;padding-bottom:9px;
  border-radius:12px;background:var(--card-bg);border:1px solid var(--card-line);
  box-shadow:0 16px 40px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.18);
  color:var(--label-1);
  opacity:0;transform:translateY(4px) scale(.985);pointer-events:none;
  transition:opacity .14s ease,transform .14s cubic-bezier(.2,.8,.3,1);
}
.cline-card[data-open="true"]{opacity:1;transform:none;pointer-events:auto}
/* 小尖角永远朝下，指着 pill */
.cline-card::after{
  content:"";position:absolute;left:var(--cline-arrow,14px);bottom:-5px;width:8px;height:8px;
  background:inherit;border-right:1px solid var(--card-line);border-bottom:1px solid var(--card-line);
  transform:rotate(45deg);
}
/* 卡片头部：左侧「渠道商排行」，中间本次会话路由到的供应商 */
/* 左右各一条 1fr 轨道，路由自然居中；三者都在同一个网格里，按中轴线对齐 */
.cline-head{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:10px 12px 0;font-size:10.5px;line-height:16px;color:var(--caption);white-space:nowrap;
}
.cline-title{justify-self:start}
.cline-route{display:flex;align-items:center;gap:4px;justify-self:center;min-width:0}
.cline-route .cline-arrow{color:var(--caption);padding:0}
.cline-route .cline-link{display:inline-flex;align-items:center;gap:4px;color:inherit}
.cline-route .cline-route-mark,
.cline-route .cline-route-mark>svg,
.cline-route .cline-route-mark>img{display:block;width:12px;height:12px;flex:none}
/* 四列、紧凑；滚动条隐藏，靠鼠标滚轮翻。高度正好四下整行，不切半行 */
.cline-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px 6px;
  padding:8px 12px 0;margin:0;list-style:none;
  max-height:107px;overflow:auto;overscroll-behavior:contain;
  scrollbar-width:none;-ms-overflow-style:none;
}
.cline-grid::-webkit-scrollbar{width:0;height:0;display:none}
.cline-ev{display:flex;align-items:center;gap:5px;min-width:0}
.cline-ev-mark,.cline-ev-mark>svg,.cline-ev-mark>img{display:block;width:14px;height:14px;flex:none}
.cline-name{
  font-size:12px;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cline-note{padding:20px 12px;font-size:12.5px;color:var(--caption)}

/* ============ 品牌色 ============
   由 dsh/client.js 的 COLORS 生成，请勿手改（改了下次同步会被覆盖）。
   要加/改品牌色，改插件里的 COLORS，再跑：
     node tools/sync-preview.mjs docs/hover-card-preview.html
   生成规则与插件一致：浅色为默认值，深色由主题覆盖。 */
/*BRAND_COLORS_BEGIN*/
.cline-deepseek{color:#4967F7}
.cline-alibaba{color:#BA5208}
.cline-baseten{color:#0E823E}
.cline-togetherai{color:#D34409}
.cline-modal{color:#238411}
.cline-xiaomi{color:#C45408}
.cline-openrouter{color:#607905}
.cline-deepinfra{color:#5162F8}
.cline-fireworks{color:#793FF7}
.cline-novita{color:#16864E}
.cline-morph{color:#5C7F19}
.cline-runware{color:#1C8906}
.cline-particle{color:#D212BB}
.cline-boundless{color:#377E84}
.cline-zai{color:#2E5BFF}
.cline-gmicloud{color:#D93A1F}
.cline-wafer{color:#6E32E8}
.cline-parasail{color:#1B4B8F}
.cline-relace{color:#B4462A}
.cline-inferencenet{color:#0E7C8C}
.cline-openai{color:#000000}
html[data-theme="dark"] .cline-deepseek{color:#5D77F8}
html[data-theme="dark"] .cline-alibaba{color:#F56C0A}
html[data-theme="dark"] .cline-baseten{color:#19E76E}
html[data-theme="dark"] .cline-togetherai{color:#F55310}
html[data-theme="dark"] .cline-modal{color:#8FEE7E}
html[data-theme="dark"] .cline-xiaomi{color:#F56F14}
html[data-theme="dark"] .cline-openrouter{color:#BDEE0A}
html[data-theme="dark"] .cline-deepinfra{color:#828EFA}
html[data-theme="dark"] .cline-fireworks{color:#9466F9}
html[data-theme="dark"] .cline-novita{color:#23D57C}
html[data-theme="dark"] .cline-morph{color:#8DC327}
html[data-theme="dark"] .cline-runware{color:#ADFB9D}
html[data-theme="dark"] .cline-particle{color:#F159DF}
html[data-theme="dark"] .cline-boundless{color:#63B7BE}
html[data-theme="dark"] .cline-zai{color:#7C9BFF}
html[data-theme="dark"] .cline-gmicloud{color:#FF7A5C}
html[data-theme="dark"] .cline-wafer{color:#B48CFF}
html[data-theme="dark"] .cline-parasail{color:#6FA8FF}
html[data-theme="dark"] .cline-relace{color:#F08355}
html[data-theme="dark"] .cline-inferencenet{color:#3FC5D8}
html[data-theme="dark"] .cline-openai{color:#FFFFFF}
/*BRAND_COLORS_END*/
/* 不能 display:none —— 那样 <use> 引用不到 symbol */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
<body>
<button class="theme-toggle" id="theme" type="button">浅色</button>

<div class="dock" id="dock">
  <button class="cline-trigger" id="trigger" data-open="true" aria-expanded="true" aria-haspopup="dialog" type="button">
    <span class="cline-pill" id="pill"></span>
  </button>

  <div class="cline-card" id="card" data-open="true" role="dialog" aria-label="Cline 渠道清单">
    <div class="cline-head">
      <span class="cline-title">渠道商排行</span>
      <span class="cline-route" id="route"></span>
    </div>
    <ul class="cline-grid" id="grid"></ul>
  </div>
</div>

<script>
(() => {
  'use strict';
  /* 网关探测返回的顺序，原样照抄：不排序、不去重 */
  const CHANNELS = ['novita','deepseek','togetherai','baseten','modal','openrouter','fireworks',
    'deepinfra','alibaba','zai','gmicloud','wafer','xiaomi','parasail','relace','morph','runware',
    'inferencenet','particle','boundless','openai'];
  /* 本会话已路由到的（pill 与卡片头部显示的内容，与生产一致：用网关报的原始名字） */
  const CHAIN = ['deepseek','novita'];
  /* 品牌色由 dsh/client.js 的 COLORS 生成，不在这里重复写死 */
  /*BRAND_ALIASES_BEGIN*/
const ALIASES = {together: 'togetherai', zhipu: 'zai'};
/*BRAND_ALIASES_END*/
  const $ = (id) => document.getElementById(id);
  const keyOf = (name) => ALIASES[String(name).toLowerCase().replace(/[^a-z0-9]+/g,'')]
    ?? String(name).toLowerCase().replace(/[^a-z0-9]+/g,'');
  /* 图标/文字都挂 cline-<slug> 类取品牌色；插件里没有该 slug 的色就自然继承，不做兜底 */
  const mark = (key, cls) => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class', cls + ' cline-' + key);
    const use = document.createElementNS('http://www.w3.org/2000/svg','use');
    use.setAttribute('href', '#mark-' + key);
    svg.append(use);
    return svg;
  };
  const span = (cls, text) => {
    const node = document.createElement('span');
    if (cls !== undefined) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function renderPill() {
    const pill = $('pill');
    pill.replaceChildren(span('cline-arrow','…'));
    CHAIN.forEach((name, index) => {
      const key = keyOf(name);
      if (index > 0 || CHAIN.length > 1) pill.append(span('cline-arrow','→'));
      const link = span('cline-link cline-' + key);
      link.append(mark(key,'cline-mark'), span(undefined, name));
      pill.append(link);
    });
  }
  /* 卡片头部：本次会话路由到的供应商，图标 + 品牌色，用箭头串起来 */
  function renderRoute() {
    const route = $('route');
    route.replaceChildren();
    CHAIN.forEach((name, index) => {
      const key = keyOf(name);
      if (index > 0) route.append(span('cline-arrow','→'));
      const link = span('cline-link cline-' + key);
      link.append(mark(key,'cline-route-mark'), span(undefined, name));
      route.append(link);
    });
  }
  function renderGrid() {
    $('grid').replaceChildren(...CHANNELS.map((name) => {
      const key = keyOf(name);
      const cell = document.createElement('li');
      // 品牌类挂在行上，图标与名字都靠它取色（与插件同一套做法）
      cell.className = 'cline-ev cline-' + key;
      cell.append(mark(key,'cline-ev-mark'), span('cline-name', name));
      return cell;
    }));
  }
  function render() { renderPill(); renderRoute(); renderGrid(); }

  $('theme').addEventListener('click', () => {
    const light = document.documentElement.dataset.theme === 'light';
    document.documentElement.dataset.theme = light ? 'dark' : 'light';
    $('theme').textContent = light ? '浅色' : '深色';
    render();
  });
  // 卡片默认就是打开状态，方便直接看样式；悬浮/点击仍然照常工作。
  const trigger = $('trigger');
  const card = $('card');
  const arrow = () => {
    const box = $('pill').getBoundingClientRect();
    card.style.setProperty('--cline-arrow', Math.max(12, box.left + box.width / 2 - card.getBoundingClientRect().left - 4) + 'px');
  };
  let timer = 0;
  const open = (value) => {
    card.dataset.open = String(value);
    trigger.dataset.open = String(value);
    trigger.setAttribute('aria-expanded', String(value));
    if (value) arrow();
  };
  trigger.addEventListener('mouseenter', () => { clearTimeout(timer); timer = setTimeout(() => open(true), 140); });
  card.addEventListener('mouseenter', () => clearTimeout(timer));
  const leave = () => { timer = setTimeout(() => open(false), 240); };
  trigger.addEventListener('mouseleave', leave);
  card.addEventListener('mouseleave', leave);
  trigger.addEventListener('click', () => open(card.dataset.open !== 'true'));
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') open(false); });

  render();
  arrow();
})();
</script>
