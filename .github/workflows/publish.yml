name: Publish

# Tag-driven release: pushing `vX.Y.Z` publishes the tagged commit to npm and
# creates a GitHub Release with the packed tarball attached. Release notes are
# composed from the commit subjects since the previous tag, because automatic
# notes only list merged pull requests and this repository pushes to main.
#
# Authentication is npm trusted publishing (OIDC): the job trades its GitHub
# identity for a short-lived npm credential, so no NPM_TOKEN secret is stored
# and provenance is produced automatically. One-time setup on npmjs.com:
# package Settings -> Trusted Publisher -> GitHub Actions with owner `AK-103U`,
# repository `cline-upstream-provider`, workflow `publish.yml`, and Environment
# left empty (this workflow declares no `environment:`).
#
# There is no build step in this repository: `npm pack` is the whole "build",
# and the tarball contents come from the `files` allowlist in package.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # rerun a release from an existing tag ref

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create or update the GitHub Release
      id-token: write # trusted publishing (OIDC) and provenance
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for the release notes

      - name: Set up Node and the npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate the tag and the registry state
        id: release
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$tag_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; the publish step will be skipped"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack the tarball
        run: npm pack

      - name: Publish to npm
        if: steps.release.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Compose release notes from the commits
        run: |
          set -euo pipefail
          current="$GITHUB_REF_NAME"
          git fetch --tags --force --quiet
          previous="$(git tag --sort=-v:refname --merged "$current" | grep -vx "$current" | head -n1 || true)"
          url="${{ github.server_url }}/${{ github.repository }}"
          {
            if [ -n "$previous" ]; then
              git log --no-merges --pretty=format:'- %s (`%h`)' "$previous..$current"
            else
              git log --no-merges --pretty=format:'- %s (`%h`)' "$current"
            fi
            echo
            echo
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: $url/compare/$previous...$current"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo "### \`${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| npm | https://www.npmjs.com/package/${{ steps.release.outputs.name }}/v/${{ steps.release.outputs.version }} |"
            echo "| release | ${{ github.server_url }}/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME |"
            echo "| tarball | \`$(basename ./*.tgz)\` ($(du -h ./*.tgz | awk '{print $1}')) |"
            if [ "${{ steps.release.outputs.published }}" = "true" ]; then
              echo "| npm publish | skipped, version already on npm |"
            else
              echo "| npm publish | done |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
