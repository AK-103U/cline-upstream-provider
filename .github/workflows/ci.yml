name: CI

# The suite covers the two halves' pure logic — the host's usage cache, narrowing
# and failure ladder, and the client's narrowing/level/countdown helpers — while
# what actually breaks a release (the syntax of both halves, the pi extension in
# TypeScript, and the tarball manifest produced by `npm pack`) is checked directly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Syntax check the pi extension
        run: |
          set -euo pipefail
          for file in pi/*.ts extensions/*.ts; do
            node --no-warnings --experimental-transform-types --check "$file"
            echo "ok: $file"
          done

      - name: Syntax check the DSH half
        run: |
          set -euo pipefail
          for file in dsh/*.js dsh/host/*.js; do
            node --no-warnings --check "$file"
            echo "ok: $file"
          done

      - name: Test
        run: node --test "tools/tests/**/*.test.mjs"

      - name: Check the package manifest
        run: npm pack --dry-run
